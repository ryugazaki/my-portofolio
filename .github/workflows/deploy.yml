name: CI and Deploy to GitHub Pages

on:
  # Pull requests: run tests and a build check, never deploy
  pull_request:
    branches:
      - master

  # Pushes to master (including merged PRs): test, build and deploy
  push:
    branches:
      - master

  # Allow a manual deploy from the Actions tab
  workflow_dispatch:

# Never run two deploys of the same ref at once; a newer run waits for the
# previous one instead of cancelling it mid-publish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write # needed to push the build to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

      # --base-href must match the repository name so assets resolve under
      # https://<user>.github.io/my-portofolio/
      - name: Build
        run: npm run build -- --configuration production --base-href /my-portofolio/

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/my-portofolio/browser
